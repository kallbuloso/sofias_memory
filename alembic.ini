[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# DATABASE_URL is intentionally not configured here.
# migrations/env.py loads Settings and passes the SecretStr value directly to
# SQLAlchemy/Alembic without making alembic.ini a second source of truth.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
