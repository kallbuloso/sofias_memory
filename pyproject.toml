[project]
name = "sofias-memory"
version = "0.1.0"
description = "Single-user semantic memory and knowledge graph service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "pgvector>=0.4,<1",
    "neo4j>=5.28,<6",
    "openai>=1.100,<2",
    "httpx>=0.28,<1",
    "tenacity>=9,<10",
    "structlog>=25,<26",
    "orjson>=3.10,<4",
    "python-multipart>=0.0.20,<1",
    "aiofiles>=24,<25",
    "filetype>=1.2,<2",
    "tiktoken>=0.9,<1",
    "pypdf>=6,<7",
    "python-docx>=1.1,<2",
    "beautifulsoup4>=4.13,<5",
    "lxml>=5,<7",
    "charset-normalizer>=3.4,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "testcontainers[postgres,neo4j]>=4.10,<5",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "bandit>=1.8,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
packages = ["sofias_memory"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["."]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: tests that require explicitly provided external infrastructure",
]

[tool.coverage.run]
source = ["sofias_memory"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
