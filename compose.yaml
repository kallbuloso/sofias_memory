services:
  sofias-memory:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.2.0}"
        VCS_REF: "${VCS_REF:-local}"
    image: sofias-memory:0.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${SOFIAS_MEMORY_HTTP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-Sofias Memory}"
      APP_ENV: "${APP_ENV:-production}"
      APP_VERSION: "${APP_VERSION:-0.2.0}"
      API_KEY: "${API_KEY:?API_KEY is required}"
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      MAX_REQUEST_BODY_MB: "${MAX_REQUEST_BODY_MB:-50}"
      REQUEST_WAIT_TIMEOUT_SECONDS: "${REQUEST_WAIT_TIMEOUT_SECONDS:-30}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-sofias_memory}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-sofias_memory}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "${DB_NEO4J_PASSWORD:?DB_NEO4J_PASSWORD is required}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      DATA_DIRECTORY: "/data/sources"
      TEMP_DIRECTORY: "/data/tmp"
      MAX_SOURCE_SIZE_MB: "${MAX_SOURCE_SIZE_MB:-50}"
      # ADR-0011: filesystem remains the default -- STORAGE_BACKEND is never
      # forced to "s3" here. Setting it (and the STORAGE_S3_* values below)
      # is entirely the operator's opt-in via .env; every S3 field is empty/
      # unset by default and forwarded only when the operator supplies it.
      STORAGE_BACKEND: "${STORAGE_BACKEND:-filesystem}"
      STORAGE_S3_BUCKET: "${STORAGE_S3_BUCKET:-}"
      STORAGE_S3_PREFIX: "${STORAGE_S3_PREFIX:-}"
      STORAGE_S3_REGION: "${STORAGE_S3_REGION:-}"
      STORAGE_S3_ENDPOINT_URL: "${STORAGE_S3_ENDPOINT_URL:-}"
      STORAGE_S3_ACCESS_KEY_ID: "${STORAGE_S3_ACCESS_KEY_ID:-}"
      STORAGE_S3_SECRET_ACCESS_KEY: "${STORAGE_S3_SECRET_ACCESS_KEY:-}"
      STORAGE_S3_SESSION_TOKEN: "${STORAGE_S3_SESSION_TOKEN:-}"
      STORAGE_S3_MAX_CONCURRENCY: "${STORAGE_S3_MAX_CONCURRENCY:-4}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY is required}"
      LLM_MODEL: "${LLM_MODEL:-gpt-5-mini}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-120}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-3}"
      LLM_MAX_CONCURRENCY: "${LLM_MAX_CONCURRENCY:-4}"
      EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-large}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-3072}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-64}"
      EMBEDDING_MAX_CONCURRENCY: "${EMBEDDING_MAX_CONCURRENCY:-4}"
      CHUNK_MAX_TOKENS: "${CHUNK_MAX_TOKENS:-900}"
      CHUNK_OVERLAP_TOKENS: "${CHUNK_OVERLAP_TOKENS:-120}"
      CHUNK_MIN_TOKENS: "${CHUNK_MIN_TOKENS:-40}"
      RECALL_VECTOR_TOP_K: "${RECALL_VECTOR_TOP_K:-50}"
      RECALL_LEXICAL_TOP_K: "${RECALL_LEXICAL_TOP_K:-50}"
      RECALL_GRAPH_SEED_TOP_K: "${RECALL_GRAPH_SEED_TOP_K:-10}"
      RECALL_GRAPH_DEPTH: "${RECALL_GRAPH_DEPTH:-2}"
      RECALL_GRAPH_MAX_NODES: "${RECALL_GRAPH_MAX_NODES:-100}"
      RECALL_DEFAULT_TOP_K: "${RECALL_DEFAULT_TOP_K:-12}"
      RECALL_MAX_TOP_K: "${RECALL_MAX_TOP_K:-100}"
      RECALL_RRF_K: "${RECALL_RRF_K:-60}"
      SESSION_CONTEXT_MAX_ENTRIES: "${SESSION_CONTEXT_MAX_ENTRIES:-20}"
      SESSION_CONTEXT_MAX_CHARS: "${SESSION_CONTEXT_MAX_CHARS:-16000}"
      GRAPH_SUBGRAPH_MAX_DEPTH: "${GRAPH_SUBGRAPH_MAX_DEPTH:-3}"
      GRAPH_SUBGRAPH_MAX_RELATIONS: "${GRAPH_SUBGRAPH_MAX_RELATIONS:-200}"
      GRAPH_PATH_MAX_DEPTH: "${GRAPH_PATH_MAX_DEPTH:-4}"
      PROVENANCE_MAX_EVIDENCE: "${PROVENANCE_MAX_EVIDENCE:-50}"
      ENTITY_DEDUP_SIMILARITY_THRESHOLD: "${ENTITY_DEDUP_SIMILARITY_THRESHOLD:-0.90}"
      ENTITY_MERGE_SIMILARITY_THRESHOLD: "${ENTITY_MERGE_SIMILARITY_THRESHOLD:-0.95}"
      WORKER_ENABLED: "${WORKER_ENABLED:-true}"
      WORKER_POLL_INTERVAL_MS: "${WORKER_POLL_INTERVAL_MS:-500}"
      WORKER_STALE_AFTER_SECONDS: "${WORKER_STALE_AFTER_SECONDS:-300}"
      WORKER_MAX_CONCURRENT_DATASETS: "${WORKER_MAX_CONCURRENT_DATASETS:-1}"
      WORKER_MAX_CONCURRENT_READS: "${WORKER_MAX_CONCURRENT_READS:-8}"
      STORE_QUERY_CONTENT: "${STORE_QUERY_CONTENT:-true}"
      LOG_DOCUMENT_CONTENT: "${LOG_DOCUMENT_CONTENT:-false}"
      LOG_LLM_PAYLOADS: "${LOG_LLM_PAYLOADS:-false}"
    volumes:
      - sofias_memory_sources:/data/sources
    tmpfs:
      - /data/tmp
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('HTTP_PORT', '8000') + '/health/live', timeout=5).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sofias_memory}"
      POSTGRES_USER: "${POSTGRES_USER:-sofias_memory}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - sofias_memory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      DB_NEO4J_PASSWORD: "${DB_NEO4J_PASSWORD:?DB_NEO4J_PASSWORD is required}"
      NEO4J_AUTH: "neo4j/${DB_NEO4J_PASSWORD:?DB_NEO4J_PASSWORD is required}"
    volumes:
      - sofias_memory_neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "cypher-shell -u neo4j -p \"$${DB_NEO4J_PASSWORD}\" 'RETURN 1'"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  sofias_memory_postgres_data:
  sofias_memory_neo4j_data:
  sofias_memory_sources:
