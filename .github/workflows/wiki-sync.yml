name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          mkdir wiki
          git -C wiki init
          git -C wiki remote add origin "$WIKI_URL"

          if git -C wiki fetch --depth=1 origin master; then
            git -C wiki checkout -B master FETCH_HEAD
          else
            git -C wiki checkout -B master
          fi

          find wiki -mindepth 1 -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki/

          git -C wiki config user.name 'github-actions[bot]'
          git -C wiki config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C wiki add -A

          if git -C wiki diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi

          git -C wiki commit -m "Sync public documentation from ${GITHUB_SHA}"
          git -C wiki push origin HEAD:master
